<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Conversor de semanas para meses</h2>
                <div class="formulario">
                    <div class="campo">
                        <span>Você está com quantas semanas de gestação?</span>
                        <input type="number" id="input_semanas" style="width:40px;"><br>
                    </div>
                    <button class="botao" onclick="calcular()">Calcular</button>
                                        <div id="div_mensagem_semanas" ></div>

</body>
</html>
<script>
    function calcular() {

        var semanas = Number(input_semanas.value);
        var mensagem = '';

        if (semanas < 0 || semanas > 43) {
            alert('Digite uma idade gestacional compatível.');
        }

            var semanaMes= [
                {semana:4, mes:1},
                {semana:8, mes:2},
                {semana:12, mes:3},
                {semana:16, mes:4},
                {semana:21, mes:5},
                {semana:26, mes:6},
                {semana:30, mes:7},
                {semana:35, mes:8},
                {semana:42, mes:9}
            ]
        for (var i= 1; i < semanaMes.length; i++){
            if(semanas <= semanaMes[i].semana){
                mensagem= `Você está com ${semanaMes[i].mes} meses. Parabéns!!!`
                break;
            }
        }

        div_mensagem_semanas.innerHTML= `${mensagem}`


    }
</script>
