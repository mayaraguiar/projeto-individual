    function obterDadosGrafico() {
        fetch(`/dash/dataProvavelParto`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();
                    plotarGrafico(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function plotarGrafico(resposta) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'DPP',
                data: [],
                fill: false,
                borderColor: 'rgb(0, 0, 0)',
                backgroundColor: 'rgb(255, 165, 0)',
                tension: 0.1
            }]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta);

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Dados DPP:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')



        for (var i = 0; i < resposta.length; i++) {
            console.log(i);
            console.log(resposta[i].mes)
            console.log(resposta[i].total)
            console.log("__________________")
            labels.push(resposta[i].mes)
            dados.datasets[0].data.push(resposta[i].total);
        }

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'bar',
            data: dados,
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'DPP',
                        font: {
                            size: 18
                        },
                        padding: {
                            top: 10,
                            bottom: 20
                        }
                    }
                }
            }
        };

        // Adicionando gráfico criado em div na tela
        let chartClass = new Chart(
            document.getElementById('grafico_barra2'),
            config
        );
    }

    function buscarGestanteAtiva() {
        fetch(`/dash/buscarGestanteAtiva`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    console.log(`Dados gestantes: ${resposta[0].totalGestantesAtivas}`)
                    gestanteAtiva.innerHTML = `${resposta[0].totalGestantesAtivas}`

                    console.log(resposta[0].totalGestantesAtivas)
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados da kpi das gestantes: ${error.message}`);
            });

    }

function buscarAltoRisco() {
        fetch(`/dash/buscarAltoRisco`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    teste.innerHTML = `${resposta[0].nomeGestante}`

                    console.log(resposta[0].totalGestantesAltoRisco)
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
