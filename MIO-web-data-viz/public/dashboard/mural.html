<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/Icon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIO Baby | Cadastro Gestante</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao()" style="background-color: #161618;">

    <div class="janela">


        <div class="header-left">

            <h1>MIO Baby</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="cards.html">
                    <h3>Consulta</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Dashboards</h3>
                </a>
            </div>

            <div class="btn-nav">
                <h3>Cadastro Gestante</h3>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash-right">


            <div class="avisos">
                <div id="alerta">
                </div>
                <div class="container">
                    <h1>Informações da gestante</h1>
                    <div class="div-form">
                        <form id="form_gestante" onsubmit="cadastrarGestante()">
    <label>
        Nome da Gestante: <br>
        <input id="nomeGestante" type="text" required>
    </label><br>
   <label>
        Data de Nascimento: <br>
        <input id="dtNascimento" type="date" required>
    </label><br>
        <label>
        Celular: <br>
        <input id="telefone" type="number" required>
    </label><br> 




         <h1>Informações Obstétricas</h1>
    <label>
        Gesta: <br>
        <select id="gesta" required>
            <option value="">Selecione</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4+</option>
        </select>
    </label><br><br>

    <label>
        Paridade: <br>
        <select id="paridade" required>
            <option value="">Selecione</option>
            <option value="0">Nenhuma</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3+</option>
        </select>
    </label><br><br>

    <label>
        Aborto: <br>
        <select id="aborto" required>
            <option value="">Selecione</option>
            <option value="0">Nenhum</option>
            <option value="1">1</option>
            <option value="2">2+</option>
        </select>
    </label><br><br>

    <label>
        N° de Parto Normal (PN): <br>
        <select id="numPN" required>
            <option value="">Selecione</option>
            <option value="0">Nenhum</option>
            <option value="1">1</option>
            <option value="2">2+</option>
        </select>
    </label><br><br>

    <label>
        N° de Parto Cesárea (PC): <br>
        <select id="numPC" required>
            <option value="">Selecione</option>
            <option value="0">Nenhum</option>
            <option value="1">1</option>
            <option value="2">2+</option>
        </select>
    </label><br><br>

    <label>
        DUM (Data da Última Menstruação): <br>
        <input type="date" id="dum" required>
    </label><br><br>

    <label>
        DPP (Data Provável do Parto): <br>
        <input type="date" id="dpp" required>
    </label><br><br>

    <label>
        Alto Risco: <br>
        <select id="altorisco" required>
            <option value="">Selecione</option>
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
        </select>
    </label><br><br>
    <label>
         Pré Natal Ativo?: <br>
        <select id="statusPreNatal" required>
            <option value="">Selecione</option>
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
        </select>
    </label><br><br>
    <button onclick= "cadastrarGestante()" class="botao" type="submit">Cadastrar</button>
</form>

                    </div>
                    <h1></h1>
                    <div class="div-results">
                        <div id="feed_container" class="feed-container">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>




</body>

</html>

<script>
    
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function cadastrarGestante() {
    const idUsuario = sessionStorage.ID_USUARIO;

    const dadosGestante = {
        nomeGestante: document.getElementById("nomeGestante").value,
        gesta: document.getElementById("gesta").value,
        paridade: document.getElementById("paridade").value,
        aborto: document.getElementById("aborto").value,
        numPN: document.getElementById("numPN").value,
        numPC: document.getElementById("numPC").value,
        dum: document.getElementById("dum").value,
        dpp: document.getElementById("dpp").value,
        altoRisco: document.getElementById("altorisco").value,
        statusPreNatal: document.getElementById("statusPreNatal").value,
        dtNascimento: document.getElementById("dtNascimento").value,
        telefone: document.getElementById("telefone").value,
    };

    console.log(dadosGestante)


    fetch("/gestante/cadastrarComGestante", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(dadosGestante)
    }).then(res => {
        if (res.ok) {
            alert("Gestante cadastrada com sucesso!");
            document.getElementById("form_gestante").reset();
        } else {
            res.text().then(texto => alert("Erro: " + texto));
        }
    }).catch(erro => {
        console.error(err);
        alert("Erro ao cadastrar");
    });

    return false;
}

    function limparFormulario() {
        document.getElementById("form_postagem").reset();
    }

    function validarSessao() {
        if (sessionStorage.ID_USUARIO == null || sessionStorage.ID_USUARIO == undefined) {
            window.location = "login.html";
        }
    }

</script>
