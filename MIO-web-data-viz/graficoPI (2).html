<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatJs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="display: flex;">

    <div>
        <canvas id="grafico_linha"style="position: relative; height:40vh; width:40vw"></canvas>
    </div>

    <div>
        <canvas id="grafico_barra" style="position: relative; height:40vh; width:40vw"></canvas>
    </div>
    <div>
      <canvas id="grafico_barra2" style="position:relative; height:40vh; width:40vw"></canvas>
  </div>
</body>



<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const ctx = document.getElementById('grafico_barra');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Jan', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul','Ago','Set','Out','Nov','Dez'],
      datasets: [{
          label: 'Parto Normal',
          data: [6.4, 6.2, 7, 6.3, 6.1, 6, 6.5, 6.3, 6.5, 6.1, 6.2, 6.4],
          backgroundColor: 'rgba(54, 162, 235, 0.7)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        },
        {
          label: 'Cesárea',
          data: [5.2, 5.5, 6.1, 5.9, 5.7, 5.8, 6, 5.9, 6.1, 5.8, 5.9, 6],
          backgroundColor: 'rgba(255, 99, 132, 0.7)',
          borderColor: 'rgba(255, 99, 132, 1)',
          borderWidth: 1
        }
    ]
    },
     options: {
      plugins:{
      title: {
                display: true,
                text: 'Via de parto no ultimo ano',
                font: {
            size: 18
          },
          color: '#000'
        }
      },
            
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
  
</script>

<script>
  const barra = document.getElementById('grafico_barra2');

  new Chart(barra, {
    type: 'bar',
    data: {
      labels: ['15/04','16/04','17/04','18/04','19/04','20/04','21/04', '22/04', '23/04', '24/04'],
      datasets: [{
        label: 'Gestante com DPP para cada mês do ano',
        data: [6.4,6.2,7,6.3,6.1,6,6.5,6.3,6.5,6.1],
        borderWidth: 1
      }]
    },
    options: {
      plugins:{
      title: {
                display: true,
                text: 'Gestante com DPP para cada mês do ano',
                font: {
            size: 18
          },
          color: '#000'
        }
      },
            
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>

 

 
</html>
